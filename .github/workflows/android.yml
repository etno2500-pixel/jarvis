name: Android CI

on:
  push:
    branches: [ "hauptsächlich" ]
  pull_request:
    branches: [ "hauptsächlich" ]

jobs:
  bauen:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: JDK 17 einrichten
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle einrichten
      uses: gradle/actions/setup-gradle@v4

    - name: Mit Gradle erstellen
      run: gradle assembleDebug --stacktrace
      working-directory: ./Jarvis

    - name: APK-Artefakt hochladen
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: Jarvis/**/build/outputs/apk/debug/*.apk
